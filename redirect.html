<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mở Remote Desktop</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  a.fullscreen-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100%;
    background: linear-gradient(160deg, #4f7cff, #2b4fd6);
    color: white;
    text-decoration: none;
    text-align: center;
    padding: 24px;
  }
  .icon { font-size: 64px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { font-size: 15px; opacity: 0.9; margin: 4px 0; }
  code {
    background: rgba(255,255,255,0.2);
    padding: 6px 12px;
    border-radius: 6px;
    display: inline-block;
    margin-top: 14px;
    font-size: 16px;
  }
  .tap-hint {
    margin-top: 24px;
    font-size: 13px;
    opacity: 0.75;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .error {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #c00;
    font-size: 16px;
    text-align: center;
    padding: 24px;
  }
</style>
</head>
<body>
  <div id="content"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const host = params.get('host');
    const port = params.get('port');
    const user = params.get('user') || 'Administrator';
    const content = document.getElementById('content');

    if (host && port) {
      const rdpUri = 'rdp://full%20address=s:' + host + ':' + port + '&username=s:' + encodeURIComponent(user);

      const a = document.createElement('a');
      a.className = 'fullscreen-btn';
      a.href = rdpUri;
      a.innerHTML =
        '<div class="icon">🖥️</div>' +
        '<h1>Bấm vào đây để mở Remote Desktop</h1>' +
        '<code>' + host + ':' + port + '</code>' +
        '<p class="tap-hint">👆 Chạm vào bất kỳ đâu trên màn hình</p>';
      content.appendChild(a);

      // Không thể tự động chuyển hướng vì trình duyệt chặn (yêu cầu người dùng bấm thật),
      // nên để cả trang là 1 nút bấm to, chỉ cần 1 cái chạm là mở app ngay.
    } else {
      content.innerHTML = '<div class="error">Thiếu thông tin host/port trong link.</div>';
    }
  </script>
</body>
</html>
