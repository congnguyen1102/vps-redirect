<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang mở Remote Desktop...</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #1e1e2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  h2 { margin-bottom: 8px; }
  p { color: #aaa; font-size: 14px; }
  code {
    background: #333;
    padding: 6px 10px;
    border-radius: 6px;
    display: inline-block;
    margin-top: 10px;
    font-size: 15px;
  }
  .btn {
    margin-top: 20px;
    padding: 12px 24px;
    background: #4f7cff;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
  }
</style>
</head>
<body>
  <h2>🔄 Đang mở Remote Desktop...</h2>
  <p id="info">Nếu app không tự mở sau 2 giây, bấm nút bên dưới.</p>
  <a class="btn" id="manualLink" href="#">Mở thủ công</a>

  <script>
    // Đọc host, port, username từ query string trên URL
    // Ví dụ: redirect.html?host=1.2.3.4&port=41520&user=Administrator
    const params = new URLSearchParams(window.location.search);
    const host = params.get('host');
    const port = params.get('port');
    const user = params.get('user') || 'Administrator';

    if (host && port) {
      const rdpUri = 'rdp://full%20address=s:' + host + ':' + port + '&username=s:' + encodeURIComponent(user);
      document.getElementById('info').innerText = host + ':' + port;
      document.getElementById('manualLink').href = rdpUri;

      // Tự động chuyển hướng sang app Remote Desktop
      window.location.href = rdpUri;
    } else {
      document.getElementById('info').innerText = 'Thiếu thông tin host/port trong link.';
    }
  </script>
</body>
</html>
